[package]
name = "pear-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "pear_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
# Direct `aes` dep only to enable its `zeroize` feature: aes-gcm 0.10 has no
# feature that forwards it, and unified features then give Aes256Gcm
# zeroize-on-drop round keys.
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
blake3 = "1"
curve25519-dalek = "5.0.0-pre.6"
# §19: long-term ed25519 device identities signing the X25519 key bundle.
# Pre-release pin matching curve25519-dalek's, from the offline registry;
# `zeroize` gives SigningKey the same zeroize-on-drop hygiene as the
# X25519 half (zeroize is already a direct dep — no new crates).
ed25519-dalek = { version = "=3.0.0-pre.6", features = ["zeroize"] }
fastcdc = "3"
filetime = "0.2"
ignore = "0.4"
notify = "8"
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3", features = ["json"] }
zeroize = "1"

[dev-dependencies]
pear-relay = { path = "../relay" }
tempfile = "3"
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"] }
